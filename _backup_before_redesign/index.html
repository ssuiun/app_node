<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Единая система документов</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#1a0d0d;--bg2:#241313;--card:#2b1616;--card2:#341a1a;--border:#4a2222;--border2:#5c2a2a;--acc:#c8282a;--acc2:#d4af37;--acc3:#2e8b57;--txt:#f5e9d9;--txt2:#c9a98a;--muted:#9b7f6b;--r:14px;--rs:8px;--tr:.22s cubic-bezier(.4,0,.2,1);--hdr1:#200f0f;--hdr2:#2c1414;--glow:0 0 18px rgba(200,40,42,.35);--glow2:0 0 10px rgba(200,40,42,.4);--heading-font:'Noto Serif SC',serif}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.6;display:flex;flex-direction:column}

  header{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));border-bottom:1px solid var(--border);padding:0 1.5rem;position:sticky;top:0;z-index:100}
  .hdr{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:1.25rem;height:66px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:.7rem;font-weight:700;font-size:1.1rem;white-space:nowrap}
  .logo-i{width:38px;height:38px;background:linear-gradient(135deg,var(--acc),var(--acc2));border:1.5px solid var(--acc2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#f5e9d9;font-family:var(--heading-font);box-shadow:var(--glow2);flex:none}
  .logo-sub{font-size:.72rem;color:var(--txt2);font-weight:400;margin-top:1px}

  nav.tools{display:flex;gap:.5rem;flex-wrap:wrap;margin-left:auto}
  .toolbtn{background:var(--bg2);border:1px solid var(--border2);color:var(--txt2);border-radius:var(--rs);padding:.55rem 1rem;font-size:.85rem;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;transition:background var(--tr),color var(--tr),border-color var(--tr),transform 160ms}
  .toolbtn .ic{font-size:1rem}
  .toolbtn:hover{color:var(--txt);border-color:var(--acc2)}
  .toolbtn:active{transform:scale(.97)}
  .toolbtn.on{background:linear-gradient(135deg,var(--acc),#8f1c1e);color:#fff;border-color:var(--acc);box-shadow:0 4px 14px rgba(200,40,42,.35)}
  .toolbtn:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

  main{flex:1;position:relative;max-width:1600px;margin:0 auto;width:100%}
  .frame-wrap{position:absolute;inset:0;display:none}
  .frame-wrap.on{display:block}
  .frame-wrap iframe{width:100%;height:100%;border:none;background:var(--bg)}

  .empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:1rem;text-align:center;padding:2rem}
  .empty.on{display:flex}
  .empty .big-i{width:72px;height:72px;background:linear-gradient(135deg,var(--acc),var(--acc2));border:2px solid var(--acc2);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2.1rem;color:#f5e9d9;font-family:var(--heading-font);box-shadow:var(--glow)}
  .empty h1{font-family:var(--heading-font);font-size:1.5rem;color:var(--txt)}
  .empty p{color:var(--txt2);max-width:420px;font-size:.92rem}
  .empty .cards{display:flex;gap:.85rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem}
  .empty .cardlink{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;color:var(--txt);text-decoration:none;font-size:.88rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:.5rem;min-width:150px;cursor:pointer;font-family:inherit;transition:border-color var(--tr),transform 160ms}
  .empty .cardlink:hover{border-color:var(--acc2);transform:translateY(-2px)}
  .empty .cardlink .ic{font-size:1.6rem}

  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:.9rem;gap:.6rem;background:var(--bg)}
  .spin{width:18px;height:18px;border:2.5px solid var(--border2);border-top-color:var(--acc2);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media(max-width:760px){
    .hdr{height:auto;padding:.75rem 0;flex-direction:column;align-items:flex-start;gap:.6rem}
    nav.tools{margin-left:0;width:100%}
    .toolbtn{flex:1;justify-content:center}
  }
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="logo"><div class="logo-i">印</div><div><div>Business Service Platform</div><div class="logo-sub">Единая система документов</div></div></div>
    <nav class="tools" aria-label="Инструменты">
      <button class="toolbtn" id="btn-akt" onclick="openTool('akt')"><span class="ic">📑</span>Акт приёма-передачи</button>
      <button class="toolbtn" id="btn-viz" onclick="openTool('viz')"><span class="ic">🛂</span>Визовые документы</button>
      <button class="toolbtn" id="btn-kadr" onclick="openTool('kadr')"><span class="ic">👥</span>Кадровые приказы</button>
      <button class="toolbtn" id="btn-marg" onclick="openTool('marg')"><span class="ic">✅</span>Marginalia</button>
    </nav>
  </div>
</header>

<main>
  <div class="empty on" id="empty-state">
    <div class="big-i">印</div>
    <h1>Единая система документов</h1>
    <p>Выберите инструмент выше, чтобы начать работу. Все три программы открываются в этом же окне — переключайтесь между ними в любой момент, не теряя введённые данные.</p>
    <div class="cards">
      <button class="cardlink" onclick="openTool('akt')"><span class="ic">📑</span>Акт приёма-передачи</button>
      <button class="cardlink" onclick="openTool('viz')"><span class="ic">🛂</span>Визовые документы</button>
      <button class="cardlink" onclick="openTool('kadr')"><span class="ic">👥</span>Кадровые приказы</button>
      <button class="cardlink" onclick="openTool('marg')"><span class="ic">✅</span>Marginalia</button>
    </div>
  </div>

  <div class="frame-wrap" id="wrap-akt">
    <div class="loading" id="load-akt"><div class="spin"></div>Загрузка…</div>
    <iframe id="frame-akt" title="Акт приёма-передачи документов"></iframe>
  </div>
  <div class="frame-wrap" id="wrap-viz">
    <div class="loading" id="load-viz"><div class="spin"></div>Загрузка…</div>
    <iframe id="frame-viz" title="Визовые документы"></iframe>
  </div>
  <div class="frame-wrap" id="wrap-kadr">
    <div class="loading" id="load-kadr"><div class="spin"></div>Загрузка…</div>
    <iframe id="frame-kadr" title="Кадровые приказы"></iframe>
  </div>
  <div class="frame-wrap" id="wrap-marg">
    <div class="loading" id="load-marg"><div class="spin"></div>Загрузка…</div>
    <iframe id="frame-marg" title="Marginalia"></iframe>
  </div>
</main>

<script>
  var SRC = {
    akt:  'akt.html',
    viz:  'visa.html',
    kadr: 'kadr.html',
    marg: 'marginalia.html'
  };
  var loaded = { akt:false, viz:false, kadr:false, marg:false };
  var current = null;

  function openTool(key){
    if (!SRC[key]) return;

    document.getElementById('empty-state').classList.remove('on');
    ['akt','viz','kadr','marg'].forEach(function(k){
      document.getElementById('wrap-'+k).classList.toggle('on', k===key);
      document.getElementById('btn-'+k).classList.toggle('on', k===key);
      document.getElementById('btn-'+k).setAttribute('aria-current', k===key ? 'page' : 'false');
    });

    if (!loaded[key]){
      var f = document.getElementById('frame-'+key);
      f.addEventListener('load', function onload(){
        var l = document.getElementById('load-'+key);
        if (l) l.style.display = 'none';
        f.removeEventListener('load', onload);
      });
      f.src = SRC[key];
      loaded[key] = true;
    }
    current = key;
    try { history.replaceState(null, '', '#' + key); } catch(e){}
  }

  (function initFromHash(){
    var h = (location.hash || '').replace('#','');
    if (SRC[h]) openTool(h);
  })();
</script>

</body>
</html>
